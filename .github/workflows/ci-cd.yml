name: Banking App CI/CD

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'   # 🔹 trigger on version tags like v1.0.0

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 🔹 required to read Git tags

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract version from Git tag
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=SNAPSHOT
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build with Maven
        run: |
          mvn clean package -Drevision=${VERSION}

      - name: Rename artifact with version
        run: |
          mv target/*.jar target/banking-app-${VERSION}.jar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: banking-app-${{ env.VERSION }}
          path: target/banking-app-*.jar

  approve-and-deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4

      - name: Deploy (simulated)
        run: |
          echo "Deploying banking app version:"
          ls -l
