# This workflow build and push a Docker container to Google Artifact Registry
# and deploy it on Cloud Run when a commit is pushed to the "main"
# branch.
#
# To configure this workflow:
#
# 1. Enable the following Google Cloud APIs:
#
#    - Artifact Registry (artifactregistry.googleapis.com)
#    - Cloud Run (run.googleapis.com)
#    - IAM Credentials API (iamcredentials.googleapis.com)
#
#    You can learn more about enabling APIs at
#    https://support.google.com/googleapi/answer/6158841.
#
# 2. Create and configure a Workload Identity Provider for GitHub:
#    https://github.com/google-github-actions/auth#preferred-direct-workload-identity-federation.
#
#    Depending on how you authenticate, you will need to grant an IAM principal
#    permissions on Google Cloud:
#
#    - Artifact Registry Administrator (roles/artifactregistry.admin)
#    - Cloud Run Developer (roles/run.developer)
#
#    You can learn more about setting IAM permissions at
#    https://cloud.google.com/iam/docs/manage-access-other-resources
#
# 3. Change the values in the "env" block to match your values.

name: 'Builds and Deploys to Cloud Run'

on:
  push:
    branches:
      - '"main"'
  workflow_dispatch:    

env:
  
  PROJECT_ID: ${{secrets.GCP_PROJECT_ID}}  
  REGION: 'us-central1' 
  REPO: 'banking-repo'
  PKG: 'banking-app'
  WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}

jobs:
  deploy:
    runs-on: 'ubuntu-latest'

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4

      
      - id: 'auth'
        uses: google-github-actions/auth@v2
        with:
         workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
         service_account: github-cloudrun-deployer@banking-app-test-486402.iam.gserviceaccount.com
         audience: https://github.com/thbikash/banking-devops-demo

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2   
   

      - name: Configure Docker for Artifact Registry
        run: |
         gcloud auth configure-docker $REGION-docker.pkg.dev --quiet
          
            
      - name: Debug identity
        run: gcloud auth list

      - name: Check Repo Exists  
        run: |-
         gcloud artifacts repositories describe banking-repo --location=us-central1  
        
      - name: 'Build and Push Container'
        run: |-
          DOCKER_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.PKG }}:${{ github.sha }}"
          docker build --tag "${DOCKER_TAG}" .
          docker push "${DOCKER_TAG}"


      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.PKG}}   # Cloud Run service name
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.PKG }}:${{ github.sha }}  
      

      - name: 'Show output'
        run: |2-
          echo ${{ steps.deploy.outputs.url }}
