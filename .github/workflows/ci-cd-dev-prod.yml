name: CI/CD – Cloud Run (Dev → Prod)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  REPOSITORY: banking-repo
  IMAGE_NAME: banking-app

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker $REGION-docker.pkg.dev --quiet
      
      - name: Normalize env vars
        run: |
          echo "PROJECT_ID=$(echo "$PROJECT_ID" | xargs)" >> $GITHUB_ENV
          echo "REGION=$(echo "$REGION" | xargs)" >> $GITHUB_ENV  

      - name: Build and Push
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:$GITHUB_SHA"
          echo "Building $IMAGE"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"


  deploy-dev:
      name: Deploy to DEV
      runs-on: ubuntu-latest
      needs: build
      environment: dev

      steps:
        - uses: google-github-actions/auth@v2
          with:
            credentials_json: ${{ secrets.GCP_SA_KEY }}

        - uses: google-github-actions/setup-gcloud@v2

        - name: Normalize env vars
          run: |
            echo "PROJECT_ID=$(echo "$PROJECT_ID" | xargs)" >> $GITHUB_ENV
            echo "REGION=$(echo "$REGION" | xargs)" >> $GITHUB_ENV

        - name: Set image
          run: |
            IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:$GITHUB_SHA"
            echo "IMAGE=$IMAGE" >> $GITHUB_ENV

        - name: Deploy DEV
          run: |
            gcloud run deploy banking-app-dev \
              --image "$IMAGE" \
              --region $REGION \
              --platform managed \
              --allow-unauthenticated \
              --max-instances=1


  deploy-prod:
    name: Deploy to PROD
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment: production

    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Normalize env vars
        run: |
            echo "PROJECT_ID=$(echo "$PROJECT_ID" | xargs)" >> $GITHUB_ENV
            echo "REGION=$(echo "$REGION" | xargs)" >> $GITHUB_ENV

      - name: Set image
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:$GITHUB_SHA"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy PROD
        run: |
          gcloud run deploy banking-app-prod \
            --image "$IMAGE" \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --max-instances=1
