name: Deploys to Google Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  SERVICE_NAME: banking-app
  REPOSITORY: banking-repo

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up gcloud
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.PROJECT_ID }}

    - name: Configure Docker for Artifact Registry
      run: |
        gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

    - name: Debug env vars
      run: |
        echo "REGION=[$REGION]"
        echo "PROJECT_ID=[$PROJECT_ID]"
        echo "REPOSITORY=[$REPOSITORY]"
       
    - name: Show final image name
      run: |
        echo "${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/banking-app:${GITHUB_SHA}"


    - name: Build Docker image
      run: |
        set -eux
        ls -la
        docker buildx build \
          --load \
          -f Dockerfile \
          -t "${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/banking-app:${GITHUB_SHA}" \
          .



    - name: Push Docker image
      run: |
        docker push $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/banking-app:${{ github.sha }}

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy $SERVICE_NAME \
          --image $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/banking-app:${{ github.sha }} \
          --region $REGION \
          --platform managed \
          --allow-unauthenticated \
          --port 8080
